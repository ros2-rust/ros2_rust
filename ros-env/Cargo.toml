[package]
name = "ros-env"
version = "0.3.0"
edition = "2021"
authors = ["Sam Privett <sam@privett.dev>"]
license = "Apache-2.0"
description = "Top-level Rust crate to include generated Rust code found in a sourced ROS 2 workspace"
rust-version.workspace = true
repository.workspace = true
keywords = ["ROS", "ROS2", "robotics"]

[lib]
# Message comments in the generated code are not doctests.
doctest = false

[dependencies]
# All the sources we `include!()` depend on this runtime.
rosidl_runtime_rs.workspace = true

# Needed for serliazation and deserialization of vendored messages
serde = { version = "1", optional = true, features = ["derive"] }
serde-big-array = { version = "0.5.1", optional = true }

# Needed to name the request and response types of the service stubs
paste = { version = "1", optional = true }

[build-dependencies]
# Used to read Cargo.toml dependencies when re-exporting generated crates
cargo_toml = "0.22"

# Helper crate for working with AMENT_PREFIX_PATH
ament_rs = "0.3"

[features]
serde = ["dep:serde", "dep:serde-big-array", "rosidl_runtime_rs/serde"]
# Replaces the packages found in the environment with the stubs in `src/shim.rs`,
# so that dependents can be built and documented without a ROS 2 installation.
use_ros_shim = ["dep:paste", "rosidl_runtime_rs/use_ros_shim"]

[package.metadata.docs.rs]
features = ["use_ros_shim"]
rustc-args = ["--cfg", "ros_distro=\"humble\""]
