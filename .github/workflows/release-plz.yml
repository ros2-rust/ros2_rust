name: Release-plz

on:
  push:
    branches:
      - main

env:
  RUSTFLAGS: "--cfg ros_distro=\"humble\""

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'ros2-rust' }}
    permissions:
      contents: write
    steps:
      # Generating a GitHub token, so that PRs and tags created by
      # the release-plz-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          # GitHub App ID secret name
          app-id: ${{ secrets.APP_ID }}
          # GitHub App private key secret name
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # One release PR per crate. release-plz manages the PRs whose branch starts
  # with pr_branch_prefix, so every crate gets its own prefix.
  release-plz-pr:
    name: Release-plz PR (${{ matrix.package }})
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'ros2-rust' }}
    strategy:
      fail-fast: false
      matrix:
        package: [rclrs, ros-env, rosidl_runtime_rs]
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      # Generating a GitHub token, so that PRs and tags created by
      # the release-plz-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          # GitHub App ID secret name
          app-id: ${{ secrets.APP_ID }}
          # GitHub App private key secret name
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # The release-plz action cannot select a package.
      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz,cargo-semver-checks
      - name: Run release-plz
        env:
          GIT_TOKEN: ${{ steps.generate-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGE: ${{ matrix.package }}
        run: |
          git config user.name "release-plz"
          git config user.email "release-plz@users.noreply.github.com"
          sed "/^\[workspace\]$/a pr_branch_prefix = \"release-plz-$PACKAGE-\"" release-plz.toml > "$RUNNER_TEMP/release-plz.toml"
          release-plz release-pr --config "$RUNNER_TEMP/release-plz.toml" --package "$PACKAGE" --git-token "$GIT_TOKEN"
