name: Rust Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run the CI at 02:22 UTC every Tuesday
    # We pick an arbitrary time outside of most of the world's work hours
    # to minimize the likelihood of running alongside a heavy workload.
    - cron: '22 2 * * 2'

env:
  CARGO_TERM_COLOR: always
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  build:
    # NOTE(esteve): Pin to the VS 2022 image until the Windows ROS build tooling supports VS 18.
    runs-on: windows-2022
    env:
      COLCON_PYTHON_EXECUTABLE: C:\pixi_ws\.pixi\envs\default\python.exe
      LIBCLANG_PATH: C:\pixi_ws\.pixi\envs\default\Library\bin
      BINDGEN_EXTRA_CLANG_ARGS: -D_Check_return_=
    steps:
      - uses: actions/checkout@v4

      - name: Make new directories and copy ros2_rust repo
        run: |
          mkdir C:\workspace\src
          mkdir C:\pixi_ws
          xcopy /E /I /Y $env:GITHUB_WORKSPACE C:\workspace\src\ros2_rust

      - name: Get prebuilt ROS files and matching Pixi environment
        run: |
          irm https://github.com/ros2/ros2/releases/download/release-rolling-nightlies/ros2-rolling-nightly-windows-amd64.zip -Outfile ros2-package-windows-AMD64.zip
          Expand-Archive -Path ros2-package-windows-AMD64.zip -DestinationPath C:/pixi_ws/
          # Use the dependencies shipped with this SDK, including its Python ABI.
          Copy-Item C:\pixi_ws\ros2-windows\pixi.toml C:\pixi_ws\pixi.toml
          Copy-Item C:\pixi_ws\ros2-windows\pixi.lock C:\pixi_ws\pixi.lock

      - name: Setup Pixi environment with ROS 2 toml file
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          manifest-path: C:/pixi_ws/pixi.toml
          activate-environment: true

      - name: Install ros2_rust prerequisites 
        # prerequisites and fixes for windows build ros2_rust:
        #     * Libclang has to be added (from the ros2_rust instructions). Older builds of the
        #       conda package only shipped a versioned libclang-13.dll, which bindgen does not
        #       find, so it gets renamed. Newer builds ship libclang.dll themselves, in which
        #       case there is nothing to rename.
        #     * colcon-ros-cargo and colcon-cargo have to be added as PyPI packages
        run: |
          pixi add "rust==1.85.0" libclang "colcon-core>=0.21.1,<0.22" --manifest-path C:\pixi_ws\pixi.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = "C:\pixi_ws\.pixi\envs\default\Library\bin\libclang-13.dll"
          $dst = "C:\pixi_ws\.pixi\envs\default\Library\bin\libclang.dll"
          if ((Test-Path $src) -and -not (Test-Path $dst)) { Rename-Item -Path $src -NewName "libclang.dll" }
          pixi add --pypi "colcon-ros-cargo@git+https://github.com/colcon/colcon-ros-cargo.git" --manifest-path C:\pixi_ws\pixi.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi add --pypi "colcon-cargo@git+https://github.com/colcon/colcon-cargo.git" --manifest-path C:\pixi_ws\pixi.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Load MSVC variables after the dependency environment is installed.
      - uses: ilammy/msvc-dev-cmd@v1.4.1

      - name: Build the rust package
        run: |
          call C:\pixi_ws\ros2-windows\setup.bat || exit /b 1
          rem GitHub prepends GITHUB_PATH to each step; put the MSVC linker first.
          set "PATH=%VCToolsInstallDir%bin\Hostx64\x64;%PATH%"
          set "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=%VCToolsInstallDir%bin\Hostx64\x64\link.exe"
          if not exist "%CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER%" exit /b 1
          python -c "import rclpy" || exit /b 1
          vcs import C:/workspace/src --input C:/workspace/src/ros2_rust/ros2_rust_rolling.repos || exit /b 1
          colcon build || exit /b 1
        working-directory: C:/workspace
        shell: cmd

      - name: Run cargo test on Rust packages
        run: |
          call C:\pixi_ws\ros2-windows\setup.bat || exit /b 1
          call C:\workspace\install\local_setup.bat || exit /b 1
          set "PATH=%VCToolsInstallDir%bin\Hostx64\x64;%PATH%"
          set "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=%VCToolsInstallDir%bin\Hostx64\x64\link.exe"
          if not exist "%CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER%" exit /b 1
          cd /d C:\workspace || exit /b 1
          colcon list > rust-packages.txt
          if errorlevel 1 exit /b 1
          set /a rust_package_count=0
          for /f "usebackq tokens=1,2,3" %%A in ("rust-packages.txt") do (
            if "%%C"=="(ros.ament_cargo)" (
              if /I not "%%A"=="examples_rclrs_minimal_pub_sub" if /I not "%%A"=="examples_rclrs_minimal_client_service" if /I not "%%A"=="rust_pubsub" (
                set /a rust_package_count+=1
                cd /d "%%B" || exit /b 1
                echo Running cargo test in %%B
                if /I "%%~nxB"=="rclrs" (
                  cargo test --locked -F default
                ) else if /I "%%~nxB"=="rosidl_runtime_rs" (
                  cargo test -F default
                ) else (
                  cargo test --locked --all-features
                )
                if errorlevel 1 exit /b 1
                cd /d C:\workspace || exit /b 1
              )
            )
          )
          if %rust_package_count% EQU 0 (
            echo No target ros.ament_cargo packages found 1>&2
            exit /b 1
          )
          exit /b 0
        shell: cmd
        working-directory: C:\workspace
