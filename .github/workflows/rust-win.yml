name: Rust Windows

on:
  push:
  pull_request:
  schedule:
    # Run the CI at 02:22 UTC every Tuesday
    # We pick an arbitrary time outside of most of the world's work hours
    # to minimize the likelihood of running alongside a heavy workload.
    - cron: '22 2 * * 2'

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # ros2-rust/ros2_rust tests pull requests and main, forks test every push.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.repository_owner != 'ros2-rust'
    # NOTE(esteve): Pin to the VS 2022 image until the Windows ROS build tooling supports VS 18.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1.4.1

      - name: Make new directories and copy ros2_rust repo
        run: |
          mkdir C:\workspace\src
          mkdir C:\overlay\src
          mkdir C:\pixi_ws
          xcopy /E /I /Y $env:GITHUB_WORKSPACE C:\workspace\src\ros2_rust

      - name: Get pixi toml file
        run: irm https://raw.githubusercontent.com/ros2/ros2/refs/heads/rolling/pixi.toml -OutFile C:\pixi_ws\pixi.toml

      - name: Setup Pixi environment with ROS 2 toml file
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: C:/pixi_ws/pixi.toml

      - name: Install ros2_rust prerequisites 
        # prerequisites and fixes for windows build ros2_rust:
        #     * Libclang has to be added (from the ros2_rust instructions). Older builds of the
        #       conda package only shipped a versioned libclang-13.dll, which bindgen does not
        #       find, so it gets renamed. Newer builds ship libclang.dll themselves, in which
        #       case there is nothing to rename.
        #     * colcon-ros-cargo and colcon-cargo have to be added as PyPI packages
        run: |
          pixi add libclang --manifest-path C:\pixi_ws\pixi.toml
          $src = "C:\pixi_ws\.pixi\envs\default\Library\bin\libclang-13.dll"
          $dst = "C:\pixi_ws\.pixi\envs\default\Library\bin\libclang.dll"
          if ((Test-Path $src) -and -not (Test-Path $dst)) { Rename-Item -Path $src -NewName "libclang.dll" }
          pixi add --pypi "colcon-ros-cargo@git+https://github.com/colcon/colcon-ros-cargo.git" --manifest-path C:\pixi_ws\pixi.toml
          pixi add --pypi "colcon-cargo@git+https://github.com/colcon/colcon-cargo.git" --manifest-path C:\pixi_ws\pixi.toml
          pixi upgrade colcon-core --manifest-path C:\pixi_ws\pixi.toml

      - name: Get prebuilt ROS files and unzip
        run: |
          irm https://github.com/ros2/ros2/releases/download/release-rolling-nightlies/ros2-rolling-nightly-windows-amd64.zip -Outfile ros2-package-windows-AMD64.zip
          Expand-Archive -Path ros2-package-windows-AMD64.zip -DestinationPath C:/pixi_ws/

      # A separate workspace, like on Linux. cmd only reports the exit code of the
      # last command, hence the explicit checks.
      - name: Build the overlay
        run: |
          call C:\pixi_ws\ros2-windows\setup.bat || exit /b 1
          pixi remove rust  --manifest-path C:\pixi_ws\pixi.toml
          pixi add "rust==1.85.0" --manifest-path C:\pixi_ws\pixi.toml || exit /b 1
          pixi run --manifest-path C:\pixi_ws\pixi.toml vcs import C:/overlay/src --input C:/workspace/src/ros2_rust/ros2_rust_rolling.repos || exit /b 1
          pixi run --manifest-path C:\pixi_ws\pixi.toml vcs import C:/overlay/src --input C:/workspace/src/ros2_rust/ros2_rust_generator.repos || exit /b 1
          pixi run --manifest-path C:\pixi_ws\pixi.toml colcon build --continue-on-error || exit /b 1
        working-directory: C:/overlay
        shell: cmd

      # The examples and the tests do not work on Windows yet, so they do not
      # fail the job. Some example builds hang, hence the timeout.
      - name: Build the examples
        continue-on-error: true
        timeout-minutes: 15
        env:
          LIBCLANG_PATH: C:\pixi_ws\.pixi\envs\default\Library\bin # See https://github.com/ros2-rust/ros2_rust?tab=readme-ov-file#sounds-great-how-can-i-try-this-out
          BINDGEN_EXTRA_CLANG_ARGS: -D_Check_return_= # to handle the clang error with the windows specific bindgen error
        run: |
          call C:\pixi_ws\ros2-windows\setup.bat || exit /b 1
          call C:\overlay\install\local_setup.bat || exit /b 1
          pixi run --manifest-path C:\pixi_ws\pixi.toml colcon build --continue-on-error --event-handlers console_direct+ || exit /b 1
        working-directory: C:/workspace
        shell: cmd

      # The library crates do not need the examples' workspace.
      - name: Run cargo test on the library crates
        continue-on-error: true
        timeout-minutes: 30
        run: |
          call C:\pixi_ws\ros2-windows\setup.bat || exit /b 1
          call C:\overlay\install\local_setup.bat || exit /b 1
          cd /d C:\workspace\src\ros2_rust || exit /b 1
          cargo test || exit /b 1
        shell: cmd
        working-directory: C:\workspace
